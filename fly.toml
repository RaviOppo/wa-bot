# fly.toml app configuration file generated for wa-bot-qayilg on 2026-11-21T03:42:25Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'wa-bot-qayilg'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'wa_bot_auth'
  destination = '/app/auth'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
