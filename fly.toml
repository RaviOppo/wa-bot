app = "wa-bot-ravi"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "wa_bot_auth"
  destination = "/app/auth"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
